<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Remover de fondos — runonweb</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				max-width: 960px;
				margin: 2rem auto;
				padding: 0 1rem;
			}
			#status {
				margin: 1rem 0;
				font-variant-numeric: tabular-nums;
			}
			#status.error {
				color: #c0392b;
				white-space: pre-wrap;
			}
			#download {
				font: inherit;
				padding: 0.5rem 1rem;
				cursor: pointer;
				margin-bottom: 1rem;
			}
			.panes {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 1rem;
			}
			figure {
				margin: 0;
			}
			figcaption {
				font-size: 0.9rem;
				opacity: 0.7;
				margin-bottom: 0.4rem;
			}
			img {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
			}
			#result {
				background:
					linear-gradient(45deg, #80808033 25%, transparent 25%),
					linear-gradient(-45deg, #80808033 25%, transparent 25%),
					linear-gradient(45deg, transparent 75%, #80808033 75%),
					linear-gradient(-45deg, transparent 75%, #80808033 75%);
				background-size: 20px 20px;
				background-position: 0 0, 0 10px, 10px -10px, -10px 0;
			}
		</style>
	</head>
	<body>
		<h1>Remover de fondos</h1>
		<p>Modelo BEN2 corriendo en tu navegador. La primera vez descarga ~219 MB y los cachea.</p>
		<div id="status">Cargando…</div>
		<button id="download" hidden>Descargar PNG sin fondo</button>
		<div class="panes">
			<figure>
				<figcaption>Original</figcaption>
				<img id="original" alt="Imagen original" />
			</figure>
			<figure>
				<figcaption>Sin fondo (PNG con alfa)</figcaption>
				<img id="result" alt="Imagen sin fondo" />
			</figure>
		</div>
		<script type="module" src="/bg-remover.js"></script>
	</body>
</html>
